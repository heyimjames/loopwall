name: Loopwall
options:
  bundleIdPrefix: com.octoberwip
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    COMBINE_HIDPI_IMAGES: "YES"

targets:
  Loopwall:
    type: application
    platform: macOS
    sources:
      - path: Loopwall/Sources
      - path: Loopwall/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octoberwip.loopwall
        PRODUCT_NAME: Loopwall
        INFOPLIST_FILE: Loopwall/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Loopwall/Loopwall.entitlements
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreImage.framework
      - sdk: ServiceManagement.framework
      - sdk: IOKit.framework
      - sdk: UniformTypeIdentifiers.framework
